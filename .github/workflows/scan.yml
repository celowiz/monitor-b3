# Gera os dados do painel (latest.json + candles) e publica o app Vite no GitHub Pages.
# Os dados vão só no artefato do Pages (não são commitados), então o histórico do repo não cresce.
# Se a geração falhar, nada é publicado e o site anterior continua no ar.
name: Scan and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # B3 session ~10:30–17:00 America/Sao_Paulo (UTC-3, no DST) on weekdays.
    # Minutos :04/:34 em vez de :00/:30 (horários mais disputados no GitHub Actions, que atrasam até 2–3 h).
    - cron: "34 13 * * 1-5" # 10:34 BRT
    - cron: "4,34 14-19 * * 1-5" # 11:04–16:34 BRT
    - cron: "4 20 * * 1-5" # 17:04 BRT
    # NYSE 9:30–16:00 ET: em EDT já coberto acima; em EST (nov–mar) fecha 18:00 BRT.
    - cron: "34 20 * * 1-5" # 17:34 BRT
    - cron: "4,34 21 * * 1-5" # 18:04/18:34 BRT (fechamento NYSE no horário padrão)
  workflow_dispatch:
    inputs:
      force:
        description: "Rodar mesmo em feriado, fim de semana ou antes do horário especial"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests (calendário)
        run: python3 -m unittest tests.test_b3_calendar tests.test_b3_site tests.test_nyse_calendar -v
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (indicadores + screener legado)
        run: python -m unittest tests.test_build_data tests.test_history tests.test_adjust tests.test_panel tests.test_screener_chart tests.test_screener_filters -v
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build do app
        working-directory: web
        run: npm ci && npm test && npm run build

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      skip: ${{ steps.cal.outputs.skip }}
    env:
      PYTHONUNBUFFERED: "1"
      # PR/branch: sempre roda (validação); main: respeita o calendário B3.
      FORCE_RUN: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && 'true' || github.event.inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v7

      # Roda se B3 OU NYSE tiver pregão; cada mercado sempre é regenerado (o artefato do Pages
      # substitui o site inteiro), então num feriado de um deles os dados ficam no último fechamento.
      - name: Check B3 + NYSE calendars
        id: cal
        run: |
          python3 b3_calendar.py --github-output
          python3 nyse_calendar.py --github-output
          . <(grep -E '^(skip|skip_us)=' "$GITHUB_OUTPUT" | sed 's/^/export /')
          if [ "$skip" = "true" ] && [ "$skip_us" = "true" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v7
        if: steps.cal.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.cal.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Unit tests
        if: steps.cal.outputs.skip != 'true'
        run: python -m unittest tests.test_b3_calendar tests.test_nyse_calendar tests.test_build_data tests.test_history tests.test_adjust tests.test_panel -v

      # Eventos de ações da B3 (grupamentos/desdobramentos), por emissor, renovados a cada ~20 h (scripts/adjust.py).
      - name: Cache eventos B3
        if: steps.cal.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: .cache/b3_events.json
          key: b3-events-${{ github.run_id }}
          restore-keys: b3-events-

      # BR e US em paralelo (downloads independentes). Falha no BR aborta; falha no US só
      # deixa o seletor US indisponível no app.
      - name: Gerar dados BR (brapi + yfinance + carteiras B3) e US (S&P 500)
        if: steps.cal.outputs.skip != 'true'
        run: |
          python scripts/build_data.py --market br --out web/public/data > br.log 2>&1 & BR=$!
          python scripts/build_data.py --market us --out web/public/data > us.log 2>&1 & US=$!
          BRC=0; USC=0; wait $BR || BRC=$?; wait $US || USC=$?
          echo "::group::BR"; cat br.log; echo "::endgroup::"; echo "::group::US"; cat us.log; echo "::endgroup::"
          [ $USC -eq 0 ] || echo "::warning::dados US falharam (exit $USC); publicando só BR"
          exit $BRC

      - uses: actions/setup-node@v7
        if: steps.cal.outputs.skip != 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dependências do app
        if: steps.cal.outputs.skip != 'true'
        working-directory: web
        run: npm ci

      # Backtest walk-forward das telas da galeria e dos alertas (painel em .cache/panel_*.json, gerado acima)
      # e alertas de fechamento: data/alerts/*.json + RSS. O estado anterior vem do site publicado (sem commit,
      # sem email). Falha aqui não derruba a publicação: o app esconde backtest/alertas ausentes.
      - name: Backtest e alertas (RSS)
        if: steps.cal.outputs.skip != 'true'
        working-directory: web
        run: npx vite-node scripts/derived.ts -- --data public/data --panel ../.cache --alerts ../alerts || echo "::warning::backtest/alertas falharam nesta rodada"

      # Resumo pequeno (data/summary.json) lido pela página Mercado Hoje do portfólio. Mesmas regras do app
      # (breadth + signalHit). Falha aqui não derruba a publicação: o portfólio mantém o último resumo válido.
      - name: Resumo para o portfólio
        if: steps.cal.outputs.skip != 'true'
        working-directory: web
        run: npx vite-node scripts/summary.ts -- --data public/data || echo "::warning::summary.json falhou nesta rodada"

      - name: Build do app
        if: steps.cal.outputs.skip != 'true'
        working-directory: web
        run: npm test && npm run build && touch dist/.nojekyll

      - name: Exigir dados antes de publicar
        if: steps.cal.outputs.skip != 'true'
        run: test -f web/dist/index.html && test -f web/dist/data/latest.json && test -f web/dist/data/latest_br.json

      - uses: actions/configure-pages@v6
        if: steps.cal.outputs.skip != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: steps.cal.outputs.skip != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web/dist
      # Fora da main: só valida e guarda o build como artefato comum (sem publicar).
      - uses: actions/upload-artifact@v7
        if: steps.cal.outputs.skip != 'true' && (github.ref != 'refs/heads/main' || github.event_name == 'pull_request')
        with:
          name: site-preview
          path: web/dist
          retention-days: 3

  deploy:
    needs: scan
    if: needs.scan.result == 'success' && needs.scan.outputs.skip != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
