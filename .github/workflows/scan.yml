# Gera os dados do painel (latest.json + candles) e publica o app Vite no GitHub Pages.
# Os dados vão só no artefato do Pages (não são commitados), então o histórico do repo não cresce.
# Se a geração falhar, nada é publicado e o site anterior continua no ar.
name: Scan and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # A cada 30 min nos dias úteis, 10:04–18:34 America/Sao_Paulo (UTC-3, sem horário de verão): cobre o pregão da B3
    # (10:00–17:00 BRT com NY em EDT; 10:00–18:00 a partir de 03/11/2026, com NY em EST) e o da NYSE (9:30–16:00 ET =
    # 10:30–17:00 BRT em EDT, 11:30–18:00 em EST). Durante o pregão os números do dia são parciais (intraday=true no
    # summary.json e selo "Intradiário · parcial" na página) até a rodada de fechamento (fechamento + 30 min).
    # Minutos :04/:34 em vez de :00/:30 (horários mais disputados no GitHub Actions, que atrasam até 2–3 h) e sem colidir
    # com os outros repos (rrg :07, hmm :13, pairs :17, setores :09/:39, mercado-hoje :11/:41).
    - cron: "4,34 13-21 * * 1-5" # 10:04–18:34 BRT (18:04/18:34 = fechamento da B3 e da NYSE no horário padrão dos EUA)
    # Rodada tardia (23:47 BRT): das 20:00 ET (fim do after-market) até ~1h20 depois o Yahoo devolve as ações
    # dos EUA sem a barra diária do pregão (os índices não são afetados). Os runs atrasados que caem nessa janela
    # publicam o pregão anterior; este cron, depois da janela em EDT e EST, deixa o dia fechado com a barra certa.
    - cron: "47 2 * * 2-6" # 23:47 BRT
  workflow_dispatch:
    inputs:
      force:
        description: "Rodar mesmo em feriado, fim de semana ou antes do horário especial"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests (calendário)
        run: python3 -m unittest tests.test_b3_calendar tests.test_b3_site tests.test_nyse_calendar -v
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (indicadores + screener legado)
        run: python -m unittest tests.test_build_data tests.test_fingerprint tests.test_history tests.test_adjust tests.test_panel tests.test_screener_chart tests.test_screener_filters -v
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build do app
        working-directory: web
        run: npm ci && npm test && npm run build

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      skip: ${{ steps.cal.outputs.skip }}
      same: ${{ steps.fp.outputs.same }}
    env:
      PYTHONUNBUFFERED: "1"
      # PR/branch: sempre roda (validação); main: respeita o calendário B3.
      FORCE_RUN: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && 'true' || github.event.inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v7

      # Roda se B3 OU NYSE tiver pregão; cada mercado sempre é regenerado (o artefato do Pages
      # substitui o site inteiro), então num feriado de um deles os dados ficam no último fechamento.
      - name: Check B3 + NYSE calendars
        id: cal
        run: |
          python3 b3_calendar.py --github-output
          python3 nyse_calendar.py --github-output
          . <(grep -E '^(skip|skip_us)=' "$GITHUB_OUTPUT" | sed 's/^/export /')
          if [ "$skip" = "true" ] && [ "$skip_us" = "true" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v7
        if: steps.cal.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.cal.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Unit tests
        if: steps.cal.outputs.skip != 'true'
        run: python -m unittest tests.test_b3_calendar tests.test_nyse_calendar tests.test_build_data tests.test_fingerprint tests.test_history tests.test_adjust tests.test_panel -v

      # Eventos de ações da B3 (grupamentos/desdobramentos), por emissor, renovados a cada ~20 h (scripts/adjust.py).
      - name: Cache eventos B3
        if: steps.cal.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: .cache/b3_events.json
          key: b3-events-${{ github.run_id }}
          restore-keys: b3-events-

      # BR e US em paralelo (downloads independentes). Falha no BR aborta; falha no US só
      # deixa o seletor US indisponível no app.
      - name: Gerar dados BR (brapi + yfinance + carteiras B3) e US (S&P 500)
        if: steps.cal.outputs.skip != 'true'
        run: |
          python scripts/build_data.py --market br --out web/public/data > br.log 2>&1 & BR=$!
          python scripts/build_data.py --market us --out web/public/data > us.log 2>&1 & US=$!
          BRC=0; USC=0; wait $BR || BRC=$?; wait $US || USC=$?
          echo "::group::BR"; cat br.log; echo "::endgroup::"; echo "::group::US"; cat us.log; echo "::endgroup::"
          [ $USC -eq 0 ] || echo "::warning::dados US falharam (exit $USC); publicando só BR"
          exit $BRC

      - uses: actions/setup-node@v7
        if: steps.cal.outputs.skip != 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dependências do app
        if: steps.cal.outputs.skip != 'true'
        working-directory: web
        run: npm ci

      # Backtest walk-forward das telas da galeria e dos alertas (painel em .cache/panel_*.json, gerado acima)
      # e alertas de fechamento: data/alerts/*.json + RSS. O estado anterior vem do site publicado (sem commit,
      # sem email). Falha aqui não derruba a publicação: o app esconde backtest/alertas ausentes.
      - name: Backtest e alertas (RSS)
        if: steps.cal.outputs.skip != 'true'
        working-directory: web
        run: npx vite-node scripts/derived.ts -- --data public/data --panel ../.cache --alerts ../alerts || echo "::warning::backtest/alertas falharam nesta rodada"

      # Resumo pequeno (data/summary.json) lido pela página Mercado Hoje do portfólio. Mesmas regras do app
      # (breadth + signalHit). Falha aqui não derruba a publicação: o portfólio mantém o último resumo válido.
      - name: Resumo para o portfólio
        if: steps.cal.outputs.skip != 'true'
        working-directory: web
        run: npx vite-node scripts/summary.ts -- --data public/data || echo "::warning::summary.json falhou nesta rodada"

      - name: Build do app
        if: steps.cal.outputs.skip != 'true'
        working-directory: web
        run: npm test && npm run build && touch dist/.nojekyll

      - name: Exigir dados antes de publicar
        if: steps.cal.outputs.skip != 'true'
        run: test -f web/dist/index.html && test -f web/dist/data/latest.json && test -f web/dist/data/latest_br.json

      # Rodadas agendadas que trazem exatamente os mesmos números da publicação anterior (ex.: depois do fechamento)
      # não republicam: compara a impressão digital dos dados (sem a hora da rodada) com a do site no ar.
      # Push na main e workflow_dispatch sempre publicam (mudança de código).
      - name: Dados mudaram desde a última publicação?
        id: fp
        if: steps.cal.outputs.skip != 'true'
        run: |
          new=$(python3 scripts/fingerprint.py web/dist/data)
          echo "$new" > web/dist/data/fingerprint.txt
          old=$(curl -fsS --max-time 15 --retry 2 "https://celowiz.github.io/monitor-b3/data/fingerprint.txt?t=$(date +%s)" 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$old" ] && [ "$old" = "$new" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dados iguais aos publicados ($new); sem novo deploy"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v6
        if: steps.cal.outputs.skip != 'true' && steps.fp.outputs.same != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: steps.cal.outputs.skip != 'true' && steps.fp.outputs.same != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web/dist
      # Fora da main: só valida e guarda o build como artefato comum (sem publicar).
      - uses: actions/upload-artifact@v7
        if: steps.cal.outputs.skip != 'true' && (github.ref != 'refs/heads/main' || github.event_name == 'pull_request')
        with:
          name: site-preview
          path: web/dist
          retention-days: 3

  deploy:
    needs: scan
    if: needs.scan.result == 'success' && needs.scan.outputs.skip != 'true' && needs.scan.outputs.same != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
